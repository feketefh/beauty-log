name: Publish beauty-log to PyPI

on:
  release:
    types: [published]

# Least privilege by default; the publish job opts in to id-token: write.
permissions:
  contents: read

# Prevent two near-simultaneous releases from racing on the upload.
concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  release-build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("No wheel was produced.")
          wheel = wheels[0]
          print(f"Inspecting {wheel}")
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
              for name in names:
                  print(" ", name)
              required = ["beautylog/__init__.py", "beautylog/blog.py"]
              missing = [r for r in required if r not in names]
              if missing:
                  sys.exit(f"Wheel is missing: {missing}")
          print("Wheel contents OK.")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: release-build
    runs-on: ubuntu-latest

    permissions:
      # Required for Trusted Publishing (OIDC). No API token needed.
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/beauty-log

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/